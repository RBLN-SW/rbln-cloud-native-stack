# RCNS 0.11.0 values file — validated version pins and install options.
# To change install options (enable_* and so on), copy this file and edit it, or override with ansible-playbook -e.
# Do not change the version pins (kubernetes, components, and so on); they were validated together.
# For a mirror registry, change only registry and repository of image and smd under stacks.card.
# Do not put the registry account (rbln_registry_*) in this file; pass it with ansible-playbook -e or an encrypted vars file.
rcns_version: 0.11.0
kubernetes_version: 1.35.9
containerd_version: 2.3.4
crio_version: 1.35.0
kernel_pin_versions:
  ubuntu-22.04: 6.8.0-138-generic
  ubuntu-24.04: 6.8.0-139-generic
  rhel-9.6: 5.14.0-570.141.1.el9_6
  rhel-9.8: 5.14.0-687.48.1.el9_8
  rhel-10.0: 6.12.0-55.104.1.el10_0
  rhel-10.2: 6.12.0-211.55.1.el10_2
clm:
  kubespray: v2.32.0
stacks:
  card:
    atom:
      image:
        registry: repo.rebellions.ai
        repository: rebellions/rbln-driver
        tag: 3.4.1
        pullPolicy: IfNotPresent
      smd:
        registry: repo.rebellions.ai
        repository: rebellions/rbln-smd
    rebel100:
      image:
        registry: repo.rebellions.ai
        repository: rebellions/rbln-driver
        tag: 3.5.1
        pullPolicy: IfNotPresent
      smd:
        registry: repo.rebellions.ai
        repository: rebellions/rbln-smd
  rbln-npu-operator:
    chart:
      repoURL: oci://registry-1.docker.io/rebellions
      version: 0.6.0
components:
  rbln-operator: 0.6.0
  cert-manager: 1.17.0
  istio: 1.28.0

# ── Install options (defaults) ──
install_k8s: true                  # Create a Kubernetes cluster with Kubespray — set false for an existing cluster
container_runtime: containerd      # Container runtime — containerd | crio (used when install_k8s is true)
rbln_registry_username: ""         # RBLN Portal account — creates the image pull secret (repo-rbln) for the driver and RSMD images
rbln_registry_password: ""         # RBLN Portal password — pass it with -e or an encrypted vars file, not in this file
enable_npu_operator: true          # RBLN NPU Operator (required — the Operator installs the driver)
enable_npu_dra: false              # Allocate NPUs with DRA instead of the device plugin (Kubernetes 1.34 or later)
enable_npu_vm_passthrough: false   # VM passthrough — sandbox device plugin and VFIO Manager
enable_driver_auto_upgrade: false  # Upgrade nodes one by one when the driver image changes
enable_nfd: true                   # Node Feature Discovery — required for the NPU family labels; set false if NFD already runs
enable_metrics_exporter: true      # NPU metrics exporter (Prometheus format)
enable_cert_manager: false         # cert-manager (Helm)
enable_istio: false                # Istio base and istiod (Helm)
rcns_validation: false             # Run validation.yaml at the end of install.yaml
